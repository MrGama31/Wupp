name: Feature request
description: Suggest a new capability or UI change for Wupp
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: Describe what feels incomplete or what workflow you want supported.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How it should work
      description: Explain the behavior or layout you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Screenshots or references
      description: Optional screenshots or notes on how WhatsApp handles this case.
    validations:
      required: false
