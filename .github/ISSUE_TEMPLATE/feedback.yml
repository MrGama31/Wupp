name: Feedback
description: Share feedback on how Wupp looks, feels, or performs
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Share what works well, what feels rough, or what needs polish.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Wupp version
      placeholder: v1.0.0
    validations:
      required: false
