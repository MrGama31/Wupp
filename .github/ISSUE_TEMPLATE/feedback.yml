name: General Feedback
description: Share UI/UX feedback, performance impressions, or general ideas for Wupp.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your Feedback
      description: Tell us what feels great, what feels rough, or what you'd polish next.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Wupp Version
      placeholder: v1.0.0
    validations:
      required: false
